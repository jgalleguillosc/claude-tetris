<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">Tetris</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="70"></canvas>
        </div>

        <div class="panel-section hidden" id="peek-section">
          <span class="label">PRÓXIMAS 5</span>
          <canvas id="peek-canvas" width="120" height="170"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span class="energy-hint" id="energy-hint">0%</span>
          <span class="slow-indicator hidden" id="slow-indicator"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>Q</kbd> habilidad</li>
          </ul>
        </div>
      </aside>

      <div id="skill-menu" class="overlay hidden">
        <div class="overlay-box skill-box">
          <p id="skill-title">HABILIDAD</p>
          <button data-skill="peek"><kbd>1</kbd> Ver siguientes 5 piezas</button>
          <button data-skill="swap"><kbd>2</kbd> Cambiar pieza actual</button>
          <button data-skill="slow"><kbd>3</kbd> Ralentizar tiempo 10s</button>
          <button data-skill="undo"><kbd>4</kbd> Deshacer última colocación</button>
          <button data-skill="hold"><kbd>5</kbd> Reservar pieza (hold)</button>
          <p id="skill-note"></p>
          <button id="skill-cancel" class="secondary">Cancelar (Esc)</button>
        </div>
      </div>

      <div id="overlay"class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
